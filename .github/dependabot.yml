# Dependabot version updates.
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2

updates:
  # Gemfile + permission_forge.gemspec. No lockfile is committed (this is a
  # library), so CI already resolves the newest versions the constraints allow.
  # Dependabot therefore only opens a PR when a release falls outside a declared
  # constraint — a new major of a dev tool, or a Rails minor past the gemspec's
  # `< 8.2` cap. The per-Rails pins in gemfiles/ are intentional and not scanned.
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly

  # Actions used by .github/workflows/ci.yml (checkout, setup-ruby). Grouped so
  # a week's worth of action bumps arrives as a single PR.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'
