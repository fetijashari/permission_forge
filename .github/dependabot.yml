# Dependabot version updates.
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2

updates:
  # Gemfile + permission_forge.gemspec. No lockfile is committed (this is a
  # library), so CI already resolves the newest versions the constraints allow.
  # Dependabot therefore only opens a PR when a release falls outside a declared
  # constraint — a new major of a dev tool, or a Rails minor past the gemspec's
  # `< 8.2` cap. The per-Rails pins in gemfiles/ are intentional and not scanned.
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly

  # Every `uses:` in .github/workflows/*.yml (directory `/` covers that folder).
  # Each action is pinned to a full commit SHA with its release in a comment
  # (`@<sha> # vX.Y.Z`); Dependabot bumps the SHA and the comment together.
  # Not covered: `gem exec sigstore-cli:<version>` in release.yml and the
  # `services:` images in ci.yml (update those by hand). Grouped so
  # a week's worth of action bumps arrives as a single PR; the cooldown keeps
  # a release out of a version-update PR until it is 14 days old (security
  # updates are not delayed). The cooldown is on this entry only: the bundler
  # entry above is left as it was, because CI resolves gems at run time without
  # a lockfile, so delaying Dependabot's PRs would not delay what CI installs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns:
          - '*'
