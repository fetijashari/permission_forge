name: CodeQL

# CodeQL code scanning (advanced setup): the Ruby code, the admin script
# (app/frontend/permission_forge/pf_admin.js) and the workflows themselves.
# Nothing is built (build-mode none for every language) and nothing from the
# repository runs: CodeQL only extracts and queries the source. Alerts appear
# under Security -> Code scanning; on a pull request, new ones are annotated.
#
# Every file is analyzed, test/ included: there is no vendored or generated
# code in the repository, and code scanning labels alerts in test files.
# No paths filter either, so each `analyze (<language>)` check runs on every
# pull request and can be made a required check.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 5 * * 2'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      security-events: write # upload the results to code scanning

    strategy:
      fail-fast: false
      matrix:
        language: [ruby, javascript-typescript, actions]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
