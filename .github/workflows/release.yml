name: Release

# Publishes the gem to RubyGems.org when a release tag (vX.Y.Z) is pushed,
# by Trusted Publishing: RubyGems.org trusts this workflow file in the
# `rubygems` environment and swaps the job's OIDC token for a push key valid
# for 15 minutes, so no API key is stored anywhere. Release steps and the
# one-time setup: RELEASING.md.
#
# The `build` job checks the tag and builds and checks the gem with no
# credentials; `publish` then waits for the `rubygems` environment's approval,
# signs the very file that was checked (Sigstore) and pushes it. Once the gem
# is on RubyGems.org, `provenance` records a GitHub build provenance
# attestation for it, and `github-release` creates the GitHub Release for the
# tag with the gem, its Sigstore bundle and the attestation attached. Nothing
# here creates or pushes a tag or a branch, and no job after `build` checks
# out or runs code from the repository.
#
# The checks catch mistakes, they are not a security boundary: a tag push runs
# this file as it is in the tagged commit, so a tag on another commit can carry
# a copy without them. What protects a release is who may create v* tags and
# who may approve the `rubygems` environment (RELEASING.md, "Approving").

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      gem: ${{ steps.version.outputs.gem }}
      sha256: ${{ steps.build.outputs.sha256 }}
      version: ${{ steps.version.outputs.version }}

    env:
      TAG: ${{ github.ref_name }}

    steps:
      # The repository is public, so the git fetches below need no credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.4'

      - name: Tag is v + PermissionForge::VERSION
        id: version
        run: |
          version=$(ruby -e 'require "./lib/permission_forge/version"; print PermissionForge::VERSION')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match PermissionForge::VERSION ($version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "gem=permission_forge-$version.gem" >> "$GITHUB_OUTPUT"

      # checkout v7 fetches the tag object itself; fetching it again by name
      # keeps this check independent of how a checkout version stores tags
      # (older ones kept a plain ref to the commit, which looks lightweight).
      - name: Tag is annotated and names this commit
        run: |
          git fetch --no-tags origin "+refs/tags/$TAG:refs/tags/$TAG"
          if [ "$(git cat-file -t "refs/tags/$TAG")" != tag ]; then
            echo "::error::$TAG is a lightweight tag; release with an annotated tag (git tag -a)"
            exit 1
          fi
          if [ "$(git rev-parse "refs/tags/$TAG^{commit}")" != "$(git rev-parse HEAD)" ]; then
            echo "::error::$TAG does not point to the commit checked out"
            exit 1
          fi

      - name: Tagged commit is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG points to a commit that is not on main"
            exit 1
          fi

      - name: Build and check the gem (umask 022)
        id: build
        env:
          GEM: pkg/${{ steps.version.outputs.gem }}
        run: |
          .github/scripts/build_gem.sh
          sha256=$(sha256sum "$GEM" | cut -d' ' -f1)
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          {
            echo "### permission_forge $TAG"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Tag | \`$TAG\` |"
            echo "| Commit | \`$(git rev-parse HEAD)\` $(git log -1 --format=%s HEAD) |"
            echo "| Gem | \`${GEM#pkg/}\` |"
            echo "| SHA-256 | \`$sha256\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gem
          path: pkg/${{ steps.version.outputs.gem }}
          if-no-files-found: error
          retention-days: 30 # as long as GitHub allows a re-run

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The approval gate. RubyGems.org only accepts this workflow's token from
    # this environment (the trusted publisher names it).
    environment:
      name: rubygems
      url: https://rubygems.org/gems/permission_forge/versions/${{ needs.build.outputs.version }}

    permissions:
      contents: read
      id-token: write # the RubyGems.org push key and the Sigstore signature

    env:
      GEM: ${{ needs.build.outputs.gem }}
      SHA256: ${{ needs.build.outputs.sha256 }}

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gem

      - name: Gem is the one the build job checked
        run: echo "$SHA256  $GEM" | sha256sum --check --strict

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.4'

      # The signer rubygems/release-gem uses, at the same version. `gem exec`
      # resolves sigstore-cli's dependencies at run time, in this job that may
      # request OIDC tokens: the same exposure as release-gem. RubyGems.org
      # checks the signature against this trusted publisher.
      - name: Sign the gem (Sigstore attestation)
        run: gem exec sigstore-cli:0.2.3 sign "$GEM" --bundle "$GEM.sigstore.json"

      # For the GitHub Release (github-release job). Uploaded before the push:
      # once the push went through, nothing in this job is left to fail.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sigstore-bundle
          path: ${{ needs.build.outputs.gem }}.sigstore.json
          if-no-files-found: error
          retention-days: 30

      # Exports the push key (GEM_HOST_API_KEY) to the steps below.
      - name: Configure RubyGems.org credentials (Trusted Publishing)
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Push to RubyGems.org
        run: gem push "$GEM" --attestation "$GEM.sigstore.json"

  # GitHub's build provenance attestation (SLSA provenance v1, signed through
  # Sigstore) for the gem that was pushed: it names this repository, this
  # workflow, the tag and the commit. Stored with the repository's attestations
  # (`gh attestation verify`) and attached to the GitHub Release. Not in the
  # `rubygems` environment, so its OIDC token is not one RubyGems.org accepts.
  provenance:
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      id-token: write # the Sigstore certificate that signs the attestation
      attestations: write # store the attestation with the repository

    env:
      GEM: ${{ needs.build.outputs.gem }}
      SHA256: ${{ needs.build.outputs.sha256 }}

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gem

      - name: Gem is the one the build job checked
        run: echo "$SHA256  $GEM" | sha256sum --check --strict

      - name: Attest build provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ needs.build.outputs.gem }}

      # The bundle is one JSON line (a Sigstore bundle around the in-toto
      # statement); `.intoto.jsonl` is the name Scorecard's Signed-Releases
      # check reads as provenance, and `gh attestation verify --bundle` takes it.
      - name: Name the attestation for the release
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" "$GEM.intoto.jsonl"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provenance
          path: ${{ needs.build.outputs.gem }}.intoto.jsonl
          if-no-files-found: error
          retention-days: 30

  # The GitHub Release for the tag, with the gem pushed to RubyGems.org, its
  # Sigstore bundle (the one RubyGems.org verified) and the provenance
  # attestation. Release notes: this version's section of the CHANGELOG.md
  # inside the gem. No approval: it runs only after `publish` succeeded, and
  # its token can write releases but cannot create a v* tag (ruleset).
  github-release:
    needs: [build, publish, provenance]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write # create the release and upload its files

    env:
      GEM: ${{ needs.build.outputs.gem }}
      SHA256: ${{ needs.build.outputs.sha256 }}
      VERSION: ${{ needs.build.outputs.version }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gem

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sigstore-bundle

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: provenance

      - name: Gem is the one the build job checked
        run: echo "$SHA256  $GEM" | sha256sum --check --strict

      - name: Signature and provenance are for this gem
        run: |
          digest=$(jq -r '.messageSignature.messageDigest | select(.algorithm == "SHA2_256") | .digest' \
            "$GEM.sigstore.json" | base64 -d | od -An -v -tx1 | tr -d ' \n')
          if [ "$digest" != "$SHA256" ]; then
            echo "::error::$GEM.sigstore.json does not sign $GEM"
            exit 1
          fi
          gh attestation verify "$GEM" --bundle "$GEM.intoto.jsonl" --repo "$GH_REPO" \
            --signer-workflow "$GH_REPO/.github/workflows/release.yml" --source-ref "refs/tags/$TAG"

      # From `## [X.Y.Z]` up to the next `## [` (or the link definitions at
      # the end), blank lines around it trimmed.
      - name: Release notes from the gem's CHANGELOG.md
        run: |
          tar -xOf "$GEM" data.tar.gz | tar -xzOf - CHANGELOG.md > CHANGELOG.md
          awk -v head="## [$VERSION]" '
            index($0, "## [") == 1 { if (found) exit; found = (index($0, head) == 1); next }
            found && /^\[[^]]+\]: / { exit }
            found && NF { if (started) for (; blanks > 0; blanks--) print ""; started = 1; blanks = 0; print; next }
            found { blanks++ }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION (## [$VERSION])"
            exit 1
          fi
          {
            echo
            echo '---'
            echo
            echo "\`$GEM\` SHA-256 \`$SHA256\`, as on RubyGems.org. Attached: its Sigstore signature" \
              "(\`$GEM.sigstore.json\`) and its build provenance (\`$GEM.intoto.jsonl\`);" \
              "[how to verify them](https://github.com/$GH_REPO/blob/$TAG/RELEASING.md#verifying-a-release)."
          } >> notes.md

      # Latest only for the highest version (a fix release for an older minor
      # leaves Latest alone); a version with letters (1.0.0.rc1) is a
      # prerelease. A re-run finds the release it created and replaces its files.
      - name: Create the GitHub Release
        run: |
          case "$VERSION" in
            *[!0-9.]*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          latest=false
          if [ "$prerelease" = false ]; then
            newest=$(
              {
                gh release list --exclude-drafts --exclude-pre-releases --limit 1000 \
                  --json tagName --jq '.[].tagName'
                echo "$TAG"
              } | grep -E '^v[0-9]+(\.[0-9]+)*$' | sed 's/^v//' | sort -V | tail -n 1
            )
            if [ "$newest" = "$VERSION" ]; then latest=true; fi
          fi

          assets=("$GEM" "$GEM.sigstore.json" "$GEM.intoto.jsonl")
          if gh release view "$TAG" --json tagName > /dev/null 2>&1; then
            echo "::notice::The release $TAG exists (a re-run): replacing its files"
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --verify-tag --draft=false --prerelease="$prerelease" --latest="$latest"
          else
            gh release create "$TAG" "${assets[@]}" --verify-tag --title "$TAG" --notes-file notes.md \
              --prerelease="$prerelease" --latest="$latest"
          fi
          echo "GitHub Release: https://github.com/$GH_REPO/releases/tag/$TAG (latest: $latest)" >> "$GITHUB_STEP_SUMMARY"
