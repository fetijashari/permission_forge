name: Release

# Publishes the gem to RubyGems.org when a release tag (vX.Y.Z) is pushed,
# by Trusted Publishing: RubyGems.org trusts this workflow file in the
# `rubygems` environment and swaps the job's OIDC token for a short-lived push
# key, so no API key is stored anywhere. The steps and the one-time setup are
# in RELEASING.md.
#
# The `build` job checks the tag and builds and checks the gem with no
# credentials. Only then does `publish` wait for the `rubygems` environment's
# approval, sign the very file that was checked (Sigstore) and push it.
# Nothing here creates or pushes a tag or a branch.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      gem: ${{ steps.build.outputs.gem }}
      sha256: ${{ steps.build.outputs.sha256 }}
      version: ${{ steps.version.outputs.version }}

    env:
      TAG: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.4'

      - name: Tag is v + PermissionForge::VERSION
        id: version
        run: |
          version=$(ruby -e 'require "./lib/permission_forge/version"; print PermissionForge::VERSION')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match PermissionForge::VERSION ($version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "GEM=permission_forge-$version.gem" >> "$GITHUB_ENV"

      # Fetched again by name: the checkout may hold the tag as a plain ref to
      # the commit, which would make every tag look lightweight.
      - name: Tag is annotated and names this commit
        run: |
          git fetch --no-tags origin "+refs/tags/$TAG:refs/tags/$TAG"
          if [ "$(git cat-file -t "refs/tags/$TAG")" != tag ]; then
            echo "::error::$TAG is a lightweight tag; release with an annotated tag (git tag -a)"
            exit 1
          fi
          if [ "$(git rev-parse "refs/tags/$TAG^{commit}")" != "$(git rev-parse HEAD)" ]; then
            echo "::error::$TAG does not point to the commit checked out"
            exit 1
          fi

      - name: Tagged commit is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG points to a commit that is not on main"
            exit 1
          fi

      # The gem keeps each file's mode on disk, so the tracked files are
      # written again under umask 022 first (0644, 0755 for executables).
      - name: Build the gem (umask 022)
        id: build
        run: |
          umask 022
          git ls-files -z | xargs -0 rm -f
          git checkout-index --all --force
          mkdir -p pkg
          gem build --strict permission_forge.gemspec --output "pkg/$GEM"
          echo "gem=$GEM" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "pkg/$GEM" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Check the gem (version, file modes, file list)
        run: ruby .github/scripts/verify_gem.rb "pkg/$GEM" "$VERSION"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gem
          path: pkg/${{ steps.build.outputs.gem }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The approval gate. RubyGems.org only accepts this workflow's token from
    # this environment (the trusted publisher names it).
    environment:
      name: rubygems
      url: https://rubygems.org/gems/permission_forge/versions/${{ needs.build.outputs.version }}

    permissions:
      contents: read
      id-token: write # the RubyGems.org push key and the Sigstore signature

    env:
      GEM: ${{ needs.build.outputs.gem }}
      SHA256: ${{ needs.build.outputs.sha256 }}

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gem

      - name: Gem is the one the build job checked
        run: echo "$SHA256  $GEM" | sha256sum --check --strict

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.4'

      # The same signer, pinned to the same version, that rubygems/release-gem
      # uses. RubyGems.org checks the signature against this trusted publisher.
      - name: Sign the gem (Sigstore attestation)
        run: gem exec sigstore-cli:0.2.3 sign "$GEM" --bundle "$GEM.sigstore.json"

      # Exports the short-lived push key (GEM_HOST_API_KEY) to the steps below.
      - name: Configure RubyGems.org credentials (Trusted Publishing)
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Push to RubyGems.org
        run: gem push "$GEM" --attestation "$GEM.sigstore.json"
