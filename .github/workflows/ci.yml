name: CI

# Every action is pinned to a full commit SHA, with its release in a comment;
# Dependabot (.github/dependabot.yml) bumps both. Checkouts keep no
# credentials: no job pushes, and the jobs run gems resolved at run time.
# The service images (postgres, mysql) are test databases, kept by tag.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '3.3', '3.4']
        rails: ['7.1', '7.2', '8.0', '8.1']

    env:
      RAILS_ENV: test
      # Each matrix cell resolves against the matching per-Rails gemfile so the
      # rails version is actually exercised (previously every cell used the same
      # latest Rails, making the matrix decorative).
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/rails_${{ matrix.rails }}.gemfile

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }}
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake test

  # Rails main, allowed to fail: an early warning, not a gate. The
  # Rails-internals canary runs first, so a change in a private Rails API the
  # gem relies on shows up as one named test with what to change. No lockfile
  # is committed: every run resolves against the current main. Never list
  # this job as a required status check (branch protection / rulesets): it
  # runs unreleased Rails and is meant to go red before a release does.
  rails-main:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30

    env:
      RAILS_ENV: test
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/rails_main.gemfile

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby / Rails main
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: '3.4'
          bundler-cache: true

      # The coverage minimum applies to the whole suite, not to one file.
      - name: Rails internals canary
        run: >-
          bundle exec ruby -Itest -e 'require "test_helper"; SimpleCov.minimum_coverage(0);
          require "./test/permission_forge/rails_internals_canary_test.rb"'

      - name: Run tests
        if: ${{ !cancelled() }}
        run: bundle exec rake test

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: RuboCop
        run: bundle exec rubocop --parallel

      - name: Reek
        run: bundle exec reek app lib

      - name: YARD (public API documented, @api markers)
        run: bundle exec rake yard:check

      - name: i18n-tasks
        run: bundle exec i18n-tasks health

      # The section the release workflow takes the GitHub Release notes from.
      - name: CHANGELOG.md has a section for PermissionForge::VERSION
        run: |
          version=$(ruby -e 'require "./lib/permission_forge/version"; print PermissionForge::VERSION')
          .github/scripts/release_notes.sh "$version" CHANGELOG.md > /dev/null

      # The release workflow's build and checks, so a pull request goes red
      # before a (permanent) release tag exists.
      - name: Build and check the gem
        run: .github/scripts/build_gem.sh

  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Brakeman (static analysis)
        run: bundle exec brakeman --no-pager --quiet --force

      - name: bundler-audit (dependency CVEs)
        run: |
          bundle exec bundle-audit update
          bundle exec bundle-audit check

  # Postgres RLS enforcement suite (Level 3) — verifies that generated
  # policies filter rows below the application layer (unscoped / raw SQL).
  rls:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: permission_forge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      DB: postgres
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Run RLS enforcement tests
        run: bundle exec rake test:rls

  # The full suite on MySQL (trilogy driver from gemfiles/mysql.gemfile).
  mysql:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: permission_forge_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      RAILS_ENV: test
      DB: mysql
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/mysql.gemfile
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Run tests on MySQL
        run: bundle exec rake test

  # Layout in a real browser, and the documentation's denial flows with Turbo.
  # test/support/preview_app.rb serves the dummy app
  # with the sample data of the whole-UI tests and prints the screens;
  # test/browser/layout_probe.js renders every page, error state and flow at
  # 360, 390, 600 and 1024px in en, sq and mk under the runner's Chrome (playwright-core,
  # channel chrome: no browser download) and fails on a document that scrolls
  # sideways, an element past the viewport outside a scroll frame, a
  # placeholder wider than its box or two sticky layers that intersect. Allowed
  # to fail until it has been green for a release: the required guards are the
  # Minitest proxies (test/permission_forge/html/layout_lint_test.rb and
  # admin_page_paths_test.rb). Never list this job as a required status check.
  browser:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20

    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: test/browser/package-lock.json

      - name: Install the probe's dependency
        run: npm ci --prefix test/browser

      - name: Serve the admin with the sample data
        run: |
          mkdir -p tmp/browser
          bundle exec ruby test/support/preview_app.rb --port 4017 > tmp/browser/preview.log 2>&1 &

      - name: Render every screen at 360, 390, 600 and 1024px in en, sq and mk
        run: >-
          node test/browser/layout_probe.js --log tmp/browser/preview.log --widths 360,390,600,1024 --locales en,sq,mk
          --out tmp/browser/layout.json --shots tmp/browser

      # The documentation's denial flows (docs/row-level-rules.md "Handling
      # Denials") in Chrome with Turbo: test/support/docs_app.rb serves the
      # generated Rails 8 app with every documented file applied; the
      # request-level guard is test/permission_forge/docs/doc_samples_test.rb.
      - name: Serve the docs app
        run: bundle exec ruby test/support/docs_app.rb --serve 4018 > tmp/browser/docs.log 2>&1 &

      - name: Drive the documentation's denial flows in Chrome
        run: node test/browser/docs_flows.spec.js --log tmp/browser/docs.log --shots tmp/browser

      - name: Keep the report and the screenshots of the failures
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-layout
          path: tmp/browser
          if-no-files-found: ignore
