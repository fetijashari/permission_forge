# Include below adds to RuboCop's default list instead of replacing it.
inherit_mode:
  merge:
    - Include

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  # RuboCop skips dot-directories unless a pattern names them.
  Include:
    - ".github/scripts/**/*.rb"
  Exclude:
    - "test/dummy/**/*"
    # The docs app's skeleton: the files `rails new`, `generate authentication` and
    # `generate scaffold` write, kept as the generators write them.
    - "test/support/docs_app/skeleton/**/*"
    - "test/support/docs_app/skeleton_api/**/*"
    - "test/benchmarks/**/*"
    - "vendor/**/*"
    - "bin/**/*"
    - "tmp/**/*"
    - "coverage/**/*"
    - "log/**/*"

Layout/LineLength:
  Max: 150

Metrics/MethodLength:
  Max: 25

Metrics/ClassLength:
  Max: 200
  Exclude:
    - "test/**/*"

Metrics/BlockLength:
  CountAsOne:
    - "array"
    - "hash"
    - "heredoc"
  Exclude:
    - "test/**/*"
    - "config/routes.rb"
    - "lib/tasks/**/*"
    - "*.gemspec"
  AllowedMethods:
    - "class_methods"
    - "included"
    - "concern"

Metrics/ModuleLength:
  Max: 150

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Naming/PredicatePrefix:
  Exclude:
    - "lib/permission_forge/concerns/**/*"
