    settings:
      items:
        action_guard_bypass:
          desc: Корисници за кои акциите на контролерите никогаш не се проверуваат,
            на пример администратори.
          name: Кој ја прескокнува проверката на акции
        action_guard_nil_user_strategy:
          desc: Што прави чуварот на контролерот со заштитена акција кога никој не
            е најавен. Ако не е поставено, го следи „Правила за записи кога никој
            не е најавен“.
          name: Заштитени акции без најавен корисник
        admin_app_name:
          desc: Името на апликацијата прикажано под логото на овие екрани.
          name: Име на апликацијата
        admin_assignment_authorization:
          desc: Код што одлучува дали барањето смее да промени кој има сет на дозволи
            или кој припаѓа на група, во овие екрани и во API. Се повикува со (controller,
            target, user_ids, action); action е :grant, :revoke, :change_expiry, :review,
            :add_member или :remove_member. Непоставено значи без дополнителна проверка.
          name: Кој смее да ги менува доделувањата
        admin_back_url:
          desc: 'Каде води врската под логото (стандардно: почетната страница на апликацијата).'
          name: Врска „Назад кон апликацијата“
        admin_docs_url:
          desc: Каде водат врските „Документација за конфигурација“ на оваа страница.
          name: Врска до документацијата
        admin_model_resolver:
          desc: Кои модели се нудат кога додавате ресурс.
          name: Модели понудени во администрацијата
        admin_session_flags:
          desc: Пријателски имиња за флеговите на сесија понудени во картичката Услови.
          name: Имиња на флегови на сесија
        admin_stale_assignment_days:
          desc: Трајните доделувања што не се прегледани толку долго се појавуваат
            под Застарени доделувања.
          name: Прегледај доделувања по
        admin_tenantless_access:
          desc: Што прават екраните и API-то за администрација со барање без закупец
            кога закупците се вклучени.
          name: Барања без закупец
        api_action_authorization:
          desc: Одлучува кои API повици смее да ги прави секој повикувач.
          name: Проверка на дозволи за API
        api_assignment_authorization:
          desc: Одлучува кој смее да доделува сетови на дозволи преку API.
          name: Проверка на доделување за API
        api_auth:
          desc: Како API повикувачите докажуваат кои се.
          name: Најава за API
        api_base_controller_class:
          desc: Контролерот од кој наследуваат API крајните точки.
          name: API контролер
        api_default_per_page:
          desc: Записи по API страница кога повикувачот не наведува.
          name: Стандардна големина на страница
        api_enabled:
          desc: Овозможува други системи да управуваат со сетовите на дозволи преку
            HTTP.
          name: JSON API
        api_max_per_page:
          desc: Горна граница на записи по API страница.
          name: Максимална големина на страница
        api_pagination_handler:
          desc: Како API резултатите се делат на страници.
          name: Страничење
        api_record_identifier:
          desc: Кој идентификатор го користи API во URL-адресите.
          name: Идентификатор на записи во API
        api_redact_rule_field_values:
          desc: Вредностите на правилата се скриени во API одговорите.
          name: Скриј ги вредностите на правилата во API
        api_require_authorization:
          desc: Одбива API промени кога не е конфигурирана проверка на дозволи.
          name: Барај API проверки на дозволи
        api_serializer_overrides:
          desc: Замени за тоа како записите се запишуваат во API одговорите.
          name: Прилагодени серијализатори
        api_stats_authorization:
          desc: Одлучува кој може да ја чита статистиката за користење преку API.
          name: Проверка на API статистиката
        api_stats_require_admin:
          desc: Само администраторите можат да ја читаат статистиката за користење
            преку API.
          name: Статистика само за администратори
        audit_actor_resolver:
          desc: Код што определува кој дејствува во барање кон овие екрани или API-то.
            Непоставено значи најавеното лице; со основна лозинка, корисничкото име.
          name: Кој се бележи како извршител
        audit_change_failure_strategy:
          desc: 'Што се случува кога промената не може да се забележи: промената се
            враќа назад (raise), поминува и се пријавува (report), или поминува и
            само се запишува во логот (log).'
          name: Кога промената не може да се забележи
        audit_events:
          desc: 'Ја бележи секоја промена направена преку моделите на дозволи — актерот
            како што е утврден (можеби непознат), кога, и претходните вредности —
            во ревизискиот дневник. Auto: вклучено кога постои ревизиската табела.'
          name: Ревизиски дневник
        audit_hook_failure_strategy:
          desc: 'Што се случува кога претплатник или hook ќе откаже при доставување
            на настан: се пријавува, само се запишува во логот, или се крева грешка.'
          name: Кога претплатник ќе откаже
        audit_log_authorization:
          desc: Код што одлучува кој смее да ги чита страниците, јазичињата, извозите
            и API-то на ревизискиот дневник. Непоставено значи секој со пристап до
            овие екрани. Подножјата „Последно уредено од“ и ознаките „Доделено од“
            сепак му го прикажуваат последниот актер на секој што може да ја отвори
            администрацијата.
          name: Кој смее да го чита ревизискиот дневник
        audit_log_subscriber:
          desc: Го запишува секој ревизиски настан и во логот на апликацијата.
          name: Копирај настани во логот
        audit_request_context:
          desc: Код што ги дава ID на барањето и IP адресата што се чуваат со секој
            настан. Непоставено значи ID на барањето и далечната IP.
          name: Детали за барањето на настаните
        audit_retention_period:
          desc: Колку долго се чуваат ревизиските настани пред задачата за чистење
            да може да ги избрише. Непоставено значи засекогаш.
          name: Чувај ревизиски настани
        audit_runtime_events:
          desc: 'Кои одлуки при извршување се чуваат, не само се објавуваат: denied,
            bypass, field_read, params_filtered, cache.'
          name: Зачувани настани при извршување
        audit_trail_enabled:
          desc: Чува креирал / последно уредил на записите на PermissionForge кога
            актерот е најавен корисник.
          name: Бележи кој креирал и кој последен уредил
        audit_user_class:
          desc: Моделот што се користи за „креирано од“ и „уредено од“.
          name: Модел на корисници за ревизија
        auto_apply_masked_attributes:
          desc: Применува маскирање кога апликацијата ги чита атрибутите директно,
            не само во одговорите.
          name: Автоматски маскирај ги атрибутите на моделот
        auto_query_scoping:
          desc: Правилата за филтрирање автоматски се додаваат на секое барање. Правилата
            што следат релација важат само за ограничени пребарувања.
          name: Примени ги правилата на сите барања
        available_locales:
          desc: Јазици на кои се достапни овие екрани.
          name: Јазици
        base_controller_class:
          desc: Контролерот на апликацијата од кој наследуваат овие екрани. Тука се
            извршува вашата проверка за најава.
          name: Администраторски контролер
        cache_backend:
          desc: Каде се кешираат пресметаните дозволи.
          name: Складиште за кеш
        cache_key_prefix:
          desc: Префикс за секој запис во кешот.
          name: Префикс на клучот за кеш
        cache_ttl:
          desc: Колку долго се чуваат пресметаните дозволи. Новата вредност важи за
            записите зачувани во кешот по промената.
          name: Траење на кешот
        conditional_set_cache_ttl:
          desc: Колку долго се чуваат дозволите за корисници со условени сетови.
          name: Траење на кешот за условени сетови
        conditional_sets_strict_mode:
          desc: Кога недостасуваат детали за барањето, строгиот режим ги третира условените
            сетови како неактивни.
          name: Строги услови за активирање
        controller_action_discovery:
          desc: Ги прикажува акциите на контролерите на апликацијата во картичката
            Акции на ресурсот, за да се дозволат или блокираат.
          name: Прикажи акции на контролери
        controller_action_resolver:
          desc: Одлучува на кој ресурс и на која акција припаѓа една акција на контролер.
          name: Поврзување на акции на контролери
        controller_discovery_exclude:
          desc: Контролери што никогаш не се прикажуваат ниту проверуваат.
          name: Изоставени контролери
        current_user_resolver:
          desc: Му кажува на PermissionForge кој е најавен при секое барање.
          name: Како се наоѓа тековниот корисник
        custom_mask_strategies:
          desc: Дополнителни стилови на маскирање дефинирани во кодот, понудени покрај
            вградените.
          name: Прилагодени стилови на маскирање
        database_row_level_security:
          desc: Дозволува самата база на податоци да ги спроведува правилата за записи
            како последна линија на одбрана.
          name: Безбедност на ниво на ред во базата
        extra_fields_default_access:
          desc: Дали виртуелно поле што никој не го конфигурирал е уредливо по основно
            или ја следи поставката „Полиња без поставка“.
          name: Виртуелни полиња без поставка
        extra_fields_method:
          desc: Метод на моделот што наведува дополнителни полиња надвор од базата
            за заштита.
          name: Метод за виртуелни полиња
        field_variant_mappings:
          desc: Поставката на полето важи и за овие поврзани имиња на колони.
          name: Поврзани варијанти на полиња
        filter_parameters_integration:
          desc: Ги додава шаблоните за приватност во filter_parameters на Rails за
            да не се прикажуваат во дневниците.
          name: Филтрирај чувствителни вредности од дневниците
        gdpr_defaults:
          desc: Колоните што изгледаат лични се маскираат по основно кога се додаваат,
            освен кога се додаваат со целосен пристап.
          name: Стандарди за приватност
        gdpr_field_patterns:
          desc: Имињата на колони што одговараат на шаблон се означуваат како чувствителни
            и го добиваат овој стил на маскирање.
          name: Шаблони за чувствителни имиња
        gdpr_require_explicit_choice:
          desc: Апликацијата одбива да се стартува додека стандардите за приватност
            не се експлицитно вклучат или исклучат.
          name: Барај избор за стандардите за приватност
        hidden_attribute_value:
          desc: Што враќа скриениот атрибут кога кодот го чита.
          name: Вредност за скриени атрибути
        http_basic_auth_enabled:
          desc: Бара заедничко корисничко име и лозинка пред некој да ги отвори овие
            екрани.
          name: Заштити ја администрацијата со лозинка
        http_basic_auth_password:
          desc: Лозинка за барањето лозинка погоре. Никогаш не се прикажува тука.
          name: Администраторска лозинка
        http_basic_auth_user:
          desc: Корисничко име за барањето лозинка погоре.
          name: Администраторско корисничко име
        ignored_fields:
          desc: Колони со кои PermissionForge никогаш не управува. Не се појавуваат
            во листите на полиња.
          name: Игнорирани колони
        mask_virtual_attributes:
          desc: Ги крие или маскира и пресметаните полиња надвор од базата кога вашиот
            код ги чита од моделот.
          name: Маскирај виртуелни полиња на моделите
        masked_attributes_nil_user_strategy:
          desc: 'Дали маскираните модели ги враќаат зачуваните или скриените вредности
            кога нема тековен корисник (задачи, е-пошта, конзола). Моделот на корисникот
            останува читлив: најавувањето го чита пред некој да е најавен.'
          name: Маскирани атрибути кога никој не е најавен
        masked_write_protection:
          desc: Спречува маскирана вредност како „•••• 4821“ да се зачува врз вистинската.
          name: Зачувување маскирани вредности
        nil_user_strategy:
          desc: Дали правилата се прескокнуваат, сè се одбива, или се јавува грешка
            кога нема тековен корисник.
          name: Правила за записи кога никој не е најавен
        no_read_access_strategy:
          desc: 'Што враќаат пребарувањата на записи за најавен корисник чии сетови
            на дозволи не даваат Читање на ресурсот: редовите што ги дозволуваат правилата
            за записи (без правило, секој ред), или ниеден.'
          name: Записи без пристап за читање
        omit_hidden_in_attributes_hash:
          desc: Скриените полиња се отстрануваат од хеш-мапите на атрибути наместо
            да се постават како празни.
          name: Изостави ги скриените полиња од листите на атрибути
        on_cache_failure:
          desc: Код што се извршува кога кешираните дозволи не можеле да се исчистат,
            на пример за да ве извести. Додека не истече траењето на кешот, тој корисник
            може да ги задржи старите дозволи.
          name: Кога складиштето за кеш ќе откаже
        on_field_filtered:
          desc: Код што се извршува секој пат кога поле е филтрирано, на пример за
            да се запише во дневник.
