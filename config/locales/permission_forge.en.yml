          desc: Rule values are redacted in API responses.
          name: Hide rule values in the API
        api_require_authorization:
          desc: Refuses API changes when no permission check is configured.
          name: Require API permission checks
        api_serializer_overrides:
          desc: Overrides for how records are written in API responses.
          name: Custom serializers
        api_stats_authorization:
          desc: Decides who may read usage statistics through the API.
          name: API stats check
        api_stats_require_admin:
          desc: Only admins can read usage statistics through the API.
          name: Stats only for admins
