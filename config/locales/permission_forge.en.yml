          desc: Code that names who acts in a request to these screens or the API.
            Not set means the signed-in person; under a password prompt, the username.
          name: Who is recorded as the actor
        audit_change_failure_strategy:
          desc: 'What happens when a change cannot be recorded: the change is rolled
            back (raise), goes through and is reported (report), or goes through and
            is only logged (log).'
          name: When a change cannot be recorded
        audit_events:
          desc: 'Records each change made through the permission models — the actor
            as resolved (possibly unknown), when, and the previous values — in the
            audit log. Auto: on when the audit table exists.'
          name: Audit log
        audit_hook_failure_strategy:
          desc: 'What happens when a subscriber or hook fails while an event is delivered:
            reported, only logged, or raised.'
          name: When a subscriber fails
        audit_log_authorization:
          desc: Code that decides who may read the audit log pages, tabs, exports
            and API. Not set means anyone with access to these screens. 'Last edited
            by' footers and 'Assigned by' labels still show the latest actor to anyone
            who can open the admin.
          name: Who may read the audit log
        audit_log_subscriber:
          desc: Also writes every audit event to the application log.
          name: Copy events to the log
        audit_request_context:
          desc: Code that gives the request id and IP address stored with each event.
            Not set means the request id and the remote IP.
          name: Request details on events
        audit_retention_period:
          desc: How long audit events are kept before the purge task may delete them.
            Not set means forever.
          name: Keep audit events for
        audit_runtime_events:
          desc: 'Which runtime decisions are stored, not only published: denied, bypass,
            field_read, params_filtered, cache.'
