        audit_events: Kush ndryshoi çfarë regjistrohet në regjistrin e auditimit.
        audit_trail_enabled: Ruan krijuar-nga / ndryshuar-së-fundi-nga në regjistrimet
          e PermissionForge kur aktori është një përdorues i identifikuar.
        conditional_sets_strict_mode: Grupet me kushte mbyllen kur mungojnë informacionet
          e kërkesës.
        extra_fields_default_access: Fushat virtuale që askush nuk i ka konfiguruar
          ndjekin “Fushat pa cilësim”.
        gdpr_defaults: Kolonat e reja të ndjeshme fillojnë të maskuara.
        http_basic_auth_enabled: Qasja në këto ekrane është e mbrojtur.
        masked_attributes_nil_user_strategy: Modelet e maskuara i fshehin vlerat kur
          askush nuk ka hyrë (modeli i përdoruesit mbetet i lexueshëm për hyrjen).
        masked_write_protection: Vlerat e maskuara nuk ruhen kurrë mbrapsht.
        nil_user_strategy: Kodi pa përdorues të hyrë nuk sheh asnjë regjistrim.
        preset: Paracaktimi :strict mbyll cilësimet që si parazgjedhje e lënë qasjen
          të hapur.
        unconfigured_action_strategy: Veprimet e kontrolluesve që askush nuk i ka
          konfiguruar bllokohen.
      risks:
        admin_tenantless_access: Kërkesat e administrimit pa qiramarrës shërbehen,
          për të gjithë qiramarrësit.
        api_require_authorization: API-ja është aktive dhe ndryshimet lejohen edhe
          pa kontroll lejesh.
        audit_events: Ndryshimet nuk regjistrohen në regjistrin e auditimit (është
          çaktivizuar, ose tabela e auditimit mungon). Me audit_events = true dhe
          pa tabelë, çdo ndryshim dështon (me strategjinë e parazgjedhur :raise).
        audit_trail_enabled: Askush nuk regjistrohet si krijues ose redaktues i regjistrimeve.
        auto_query_scoping: 'Rregullat e regjistrimeve janë në përdorim, por zbatohen
          vetëm te kërkimet find_by dhe permission_scoped: pyetjet e tjera kthejnë
          çdo regjistrim.'
        conditional_sets_strict_mode: Grupet me kushte trajtohen si aktive kur mungojnë
          informacionet e kërkesës (fail-open).
        http_basic_auth_enabled: Këto ekrane janë ose të bllokuara (kërkesa për fjalëkalim
          aktive, por pa kredenciale) ose të pambrojtura (pa fjalëkalim dhe pa kontrollues
          admini të personalizuar).
        masked_write_protection: Vlerat e maskuara mund të ruhen mbi të dhënat e vërteta.
        unconfigured_field_strategy: Kolonat që askush nuk i ka konfiguruar u shfaqen
          pa maskim kujtdo që mund ta lexojë burimin.
