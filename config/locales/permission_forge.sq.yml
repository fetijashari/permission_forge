        audit_request_context:
          desc: Kod që jep ID-në e kërkesës dhe adresën IP që ruhen me çdo ngjarje.
            E pavendosur do të thotë ID-ja e kërkesës dhe IP-ja e largët.
          name: Detajet e kërkesës në ngjarje
        audit_retention_period:
          desc: Sa kohë ruhen ngjarjet e auditimit para se detyra e pastrimit të mund
            t'i fshijë. E pavendosur do të thotë përgjithmonë.
          name: Ruaj ngjarjet e auditimit për
        audit_runtime_events:
          desc: 'Cilat vendime gjatë ekzekutimit ruhen, jo vetëm publikohen: denied,
            bypass, field_read, params_filtered, cache.'
          name: Ngjarjet e ruajtura gjatë ekzekutimit
        audit_trail_enabled:
          desc: Ruan krijuar-nga / ndryshuar-së-fundi-nga në regjistrimet e PermissionForge
            kur aktori është një përdorues i identifikuar.
          name: Regjistro kush krijoi dhe kush ndryshoi së fundi
        audit_user_class:
          desc: Modeli që përdoret për “krijuar nga” dhe “ndryshuar nga”.
          name: Modeli i personave për auditim
        auto_apply_masked_attributes:
          desc: Aplikon maskimin kur aplikacioni lexon atributet drejtpërdrejt, jo
            vetëm në përgjigje.
          name: Masko automatikisht atributet e modelit
        auto_query_scoping:
          desc: Rregullat filtruese shtohen automatikisht në çdo kërkesë. Rregullat
            që ndjekin një lidhje zbatohen vetëm në kërkimet e kufizuara.
          name: Zbato rregullat në të gjitha kërkesat
        available_locales:
          desc: Gjuhët në të cilat janë të disponueshme këto ekrane.
          name: Gjuhët
        base_controller_class:
          desc: Kontrolluesi i aplikacionit nga i cili trashëgojnë këto ekrane. Këtu
            ekzekutohet kontrolli yt i hyrjes.
          name: Kontrolluesi i adminit
        cache_backend:
          desc: Ku ruhen në cache lejet e llogaritura.
          name: Ruajtja e cache-it
        cache_key_prefix:
          desc: Parashtesa për çdo hyrje në cache.
          name: Parashtesa e çelësave të cache-it
        cache_ttl:
          desc: Sa kohë mbahen lejet e llogaritura. Një vlerë e re vlen për hyrjet
            që ruhen në cache pas ndryshimit.
          name: Jetëgjatësia e cache-it
        conditional_set_cache_ttl:
          desc: Sa kohë mbahen lejet për personat me grupe me kushte.
          name: Jetëgjatësia e cache-it për grupet me kushte
        conditional_sets_strict_mode:
          desc: Kur mungojnë detajet e kërkesës, modaliteti strikt i trajton grupet
            me kushte si joaktive.
          name: Kushte aktivizimi strikte
        controller_action_discovery:
          desc: Shfaq veprimet e kontrolluesve të aplikacionit në skedën Veprimet
            të një burimi, që të lejohen ose të bllokohen.
          name: Listo veprimet e kontrolluesve
        controller_action_resolver:
          desc: Vendos se cilit burim dhe cilit veprim i përket një veprim i kontrolluesit.
          name: Lidhja e veprimeve të kontrolluesve
        controller_discovery_exclude:
          desc: Kontrollues që nuk listohen dhe nuk kontrollohen kurrë.
          name: Kontrolluesit e lënë jashtë
        current_user_resolver:
          desc: I tregon PermissionForge kush ka hyrë në çdo kërkesë.
          name: Si gjendet përdoruesi aktual
        custom_mask_strategies:
          desc: Stile shtesë maskimi të përcaktuara në kod, që ofrohen pranë atyre
            të integruara.
          name: Stile maskimi të personalizuara
        database_row_level_security:
          desc: I lejon vetë bazës së të dhënave të zbatojë rregullat e regjistrimeve
            si mbrojtje e fundit.
          name: Siguria në nivel rreshti në bazën e të dhënave
        extra_fields_default_access:
          desc: Nëse një fushë virtuale që askush nuk e ka konfiguruar është e ndryshueshme
            si parazgjedhje apo ndjek “Fushat pa cilësim”.
          name: Fushat virtuale pa cilësim
        extra_fields_method:
          desc: Metoda e modelit që liston fusha shtesë, jo të bazës së të dhënave,
            për t'u mbrojtur.
          name: Metoda e fushave virtuale
        field_variant_mappings:
          desc: Cilësimi i një fushe vlen edhe për këto emra kolonash të lidhura.
          name: Variante të lidhura fushash
        filter_parameters_integration:
          desc: Shton modelet e privatësisë te filter_parameters të Rails që regjistrat
            të mos i shfaqin.
          name: Filtro vlerat e ndjeshme nga regjistrat
        gdpr_defaults:
          desc: Kolonat që duken personale maskohen si parazgjedhje kur shtohen, përveç
            kur shtohen me qasje të plotë.
          name: Parazgjedhjet e privatësisë
        gdpr_field_patterns:
          desc: Emrat e kolonave që përputhen me një model shënohen si të ndjeshëm
            dhe marrin këtë stil maskimi.
          name: Modele emrash të ndjeshëm
        gdpr_require_explicit_choice:
          desc: Aplikacioni refuzon të niset derisa parazgjedhjet e privatësisë të
            aktivizohen ose çaktivizohen shprehimisht.
          name: Kërko zgjedhje për parazgjedhjet e privatësisë
        hidden_attribute_value:
          desc: Çfarë kthen një atribut i fshehur kur kodi e lexon.
          name: Vlera për atributet e fshehura
        http_basic_auth_enabled:
          desc: Kërkon një emër përdoruesi dhe fjalëkalim të përbashkët para se dikush
            të hapë këto ekrane.
          name: Mbro adminin me fjalëkalim
        http_basic_auth_password:
          desc: Fjalëkalimi për kërkesën e fjalëkalimit më lart. Nuk shfaqet kurrë
            këtu.
          name: Fjalëkalimi i adminit
        http_basic_auth_user:
          desc: Emri i përdoruesit për kërkesën e fjalëkalimit më lart.
          name: Emri i përdoruesit të adminit
        ignored_fields:
          desc: Kolona që PermissionForge nuk i menaxhon kurrë. Nuk shfaqen në listat
            e fushave.
          name: Kolonat e injoruara
        mask_virtual_attributes:
          desc: Fsheh ose maskon edhe fushat e llogaritura, jo të bazës së të dhënave,
            kur kodi yt i lexon nga modeli.
          name: Masko fushat virtuale në modele
        masked_attributes_nil_user_strategy:
          desc: 'Nëse modelet e maskuara kthejnë vlerat e ruajtura apo të fshehura
            kur nuk ka përdorues aktual (punë në sfond, email-e, konsola). Modeli
            i përdoruesit mbetet i lexueshëm: hyrja e lexon para se dikush të ketë
            hyrë.'
          name: Atributet e maskuara kur askush nuk ka hyrë
        masked_write_protection:
          desc: Ndalon që një vlerë e maskuar si “•••• 4821” të ruhet mbi vlerën e
            vërtetë.
          name: Ruajtja e vlerave të maskuara
        nil_user_strategy:
          desc: Nëse rregullat anashkalohen, mohojnë gjithçka ose ngrenë gabim kur
            nuk ka përdorues aktual.
          name: Rregullat e regjistrimeve kur askush nuk ka hyrë
        omit_hidden_in_attributes_hash:
          desc: Fushat e fshehura hiqen nga hash-et e atributeve në vend që të vendosen
            bosh.
          name: Lëri jashtë fushat e fshehura nga listat e atributeve
        on_cache_failure:
          desc: Kod që ekzekutohet kur lejet në cache nuk mund të pastroheshin, për
            shembull për të të njoftuar. Derisa të mbarojë jetëgjatësia e cache-it,
            ai person mund t'i mbajë lejet e vjetra.
          name: Kur dështon ruajtja e cache-it
        on_field_filtered:
          desc: Kod që ekzekutohet sa herë filtrohet një fushë, për shembull për ta
            regjistruar.
          name: Kur një fushë fshihet ose maskohet
        on_rule_bypass:
          desc: Kod që ekzekutohet kur Shiko të gjitha ose Ndrysho të gjitha anashkalon
            rregullat e regjistrimeve.
          name: Kur rregullat anashkalohen
        preset:
          desc: ":strict mbyll cilësimet që si parazgjedhje e lënë qasjen të hapur
            (lista e forcimit për prodhim në README), përveç maskimit kur askush nuk
            ka hyrë, që mbetet zgjedhje e qartë; :compat mban parazgjedhjet e bibliotekës.
            Një cilësim i vendosur në inicializues fiton gjithmonë mbi paracaktimin."
          name: Paracaktimi i cilësimeve
        profile_builder:
          desc: Detajet e profilit që ruhen në cache me lejet e çdo personi.
          name: Detajet e profilit
        request_context_resolver:
          desc: Nga vijnë adresa IP, ora dhe flamujt e sesionit.
          name: Burimi i detajeve të kërkesës
        response_filter_nil_user_strategy:
          desc: Nëse filtrimi i fushave anashkalohet apo bllokohet gjithçka kur nuk
            ka përdorues aktual.
          name: Përgjigjet kur askush nuk ka hyrë
        rls_session_variable:
          desc: Emri i variablit që i tregon bazës së të dhënave kush është përdoruesi
            aktual.
          name: Variabli i sesionit në bazën e të dhënave
        rule_secret_column_patterns:
          desc: Rregullat e regjistrimeve nuk mund të krahasojnë kolona që përputhen
            me këto modele (përmbledhje fjalëkalimesh, tokene, vlera të enkriptuara).
            Një listë bosh i lejon.
          name: Modele kolonash sekrete
        snapshot_transactions:
          desc: 'Nëse një transaksion i bazës së të dhënave vazhdon t''i shohë të
            dhënat siç ishin kur filloi. Lejet e llogaritura brenda një transaksioni
            të tillë nuk ruhen në cache. Auto vendos sipas bazës së të dhënave: MySQL
            dhe SQLite po, PostgreSQL vetëm me repeatable read ose më të fortë.'
          name: Transaksionet lexojnë nga një pamje e çastit
        table_name_prefix:
          desc: Parashtesa për tabelat e vetë PermissionForge në bazën e të dhënave.
          name: Parashtesa e tabelave
        tenant_column:
          desc: Kolona që mban qiramarrësin në çdo regjistrim.
          name: Kolona e qiramarrësit
        tenant_model:
          desc: Modeli që ndan klientët e një aplikacioni me shumë qiramarrës.
          name: Modeli i qiramarrësit
        unconfigured_action_strategy:
          desc: Çfarë ndodh me një veprim kontrolluesi që nuk e përmend asnjë Grup
            lejesh.
          name: Veprimet pa cilësim
        unconfigured_field_strategy:
          desc: Çfarë ndodh me një kolonë që nuk e përmend asnjë Grup lejesh.
          name: Fushat pa cilësim
        unscoped_query_detection:
          desc: Vëren kërkesat që anashkalojnë rregullat e regjistrimeve.
          name: Zbulo kërkesat e pambrojtura
        unscoped_query_detection_environments:
          desc: Mjediset ku zbulimi i kërkesave të pambrojtura është aktiv.
          name: Zbulimi ekzekutohet në
        user_active_check:
          desc: I tregon PermissionForge nëse llogaria e një personi të caktuar është
            ende aktive.
          name: Kontrolli i personit aktiv
        user_class:
          desc: Modeli që përfaqëson një person që mund të marrë Grupe lejesh.
          name: Modeli i personave
        user_label_formatter:
          desc: Si shfaqet një person në lista, për shembull emri dhe email-i.
          name: Etiketa e personit
        user_list_limit:
          desc: Numri maksimal i personave që ngarkohen në një listë para se të të
            kërkohet të kërkosh.
          name: Kufiri i listës së personave
        user_list_resolver:
          desc: Cilët persona shfaqen në zgjedhësit e këtyre ekraneve.
          name: Burimi i listës së personave
        uuid_generator:
          desc: Si krijohen UUID-të e regjistrimeve.
          name: Gjeneruesi i UUID-ve
        virtual_field_discovery:
          desc: Liston edhe store accessors dhe atributet e attribute API si fusha
            virtuale.
          name: Zbulo fushat virtuale
      ladder:
        active: Aktiv
        database: Baza e të dhënave
        detect: Zbulo
        enforce: Zbato
        intro: '3 nivele mbrojtjeje: zbato rregullat në kërkesa, zbulo kërkesat që
          i anashkalojnë dhe lëre bazën e të dhënave t''i zbatojë.'
        'off': Joaktiv
